
name: Car Detailing CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML quality
        run: npx --yes htmlhint index.html

  test:
    name: Website Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test website content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text()

          required = [
              "<title>",
              'id="services"',
              'id="gallery"',
              'id="contact"',
          ]

          for item in required:
              assert item in html, f"Missing website element: {item}"
              print(f"PASS: Found {item}")

          print("All website tests passed!")
          PY

  deploy:
    name: Deploy Website
    needs: [code-quality, test]
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
